<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/header :: head}"></div>
    <title th:text="|Pizzeria Bella Napoli - ${pizza.name}|"></title>
</head>

<body style="background-color:rgba(134, 84, 37, 0.527)">

    <div th:replace="~{fragments/navbar :: nav}"></div>
    
    <main class="container mt-5">
        <div class="row justify-content-md-center">
            <div class="col-6">
                <h1 th:text="${pizza.name}"></h1>
                <p th:text="|${pizza.price} €|"></p>
            </div>
            <div class="col-4">
                <img th:src="${pizza.img}" alt="Pizza img" class="img-fluid rounded">
            </div>
        </div>
        <div class="row mt-3 text-center">
            <dl>
                <dt>Ingredienti:</dt>
                <dd th:text="${pizza.description}"></dd>
            </dl>
        </div>
    </main>
    
    <div th:replace="~{fragments/header :: bootstrapScript}"></div>
</body>
