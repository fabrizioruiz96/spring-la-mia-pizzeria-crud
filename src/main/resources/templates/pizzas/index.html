<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/header :: head}"></div>
    <title>Spring Pizzeria CRUD</title>
</head>

<body style="background-color:rgba(134, 84, 37, 0.527)">

    <div th:replace="~{fragments/navbar :: nav}"></div>

    <main class="container">


        <div class="text-center m-5">
            <h1>La mia Pizzeria</h1>
        </div>

        <div th:if="${list.isEmpty()}">
            <p>La lista è vuota!</p>
        </div>

        <div th:unless="${list.isEmpty()}" class="d-flex gap-3">

            <div th:each="pizza : ${list}" class="card" style="width: 500px">
                <img th:src="${pizza.img}" class="rounded">
                <div class="card-body">
                    <h5 class="card-title" th:text="${pizza.name}"></h5>
                    <p class="card-text" th:text="${pizza.description}"></p>
                </div>
                <div class="card-body">
                    <p th:text="|€ ${pizza.price}|"></p>
                    <a th:href="@{|/pizzas/show/${pizza.id}|}" class="btn btn-primary">Dettagli -></a>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/header :: bootstrapScript}"></div>
</body>

</html>
