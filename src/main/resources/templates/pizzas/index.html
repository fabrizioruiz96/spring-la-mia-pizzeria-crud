<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/header :: head}"></div>
    <title>Crocca - Le nostre pizze</title>
</head>

<body style="background-color: #DB4718">

    <div th:replace="~{fragments/navbar :: nav}"></div>

    <main class="container">

        <div class="my-3 d-flex justify-content-between">
            <a class="btn btn-warning" th:href="@{/pizzas/create}">Aggiungi Pizza</a>
            
            <form th:action="@{/pizzas}" method="get">
                <div class="input-group">
                    <input name="keyword" th:value="${keyword}" class="form-control" type="search"
                        placeholder="Inserisci il nome" aria-label="Inserisci il titolo">
                    <button class="btn btn-warning" type="submit"><i class="bi bi-search"></i></button>
                </div>
            </form>
        </div>


        <div class="text-center mb-5">
            <h1>Le nostre pizze:</h1>
        </div>

        <div th:if="${list.isEmpty()}">
            <p>La lista è vuota!</p>
        </div>

        <div th:unless="${list.isEmpty()}" class="d-flex gap-3">

            <div th:each="pizza : ${list}" class="card" style="width: 300px">
                <img th:src="${pizza.img}" class="rounded">
                <div class="card-body">
                    <h5 class="card-title" th:text="${pizza.name}"></h5>
                    <p class="card-text" th:text="${pizza.description}"></p>
                </div>
                <div class="card-body">
                    <p th:text="|€ ${pizza.price}|"></p>
                    <a th:href="@{|/pizzas/show/${pizza.id}|}" class="btn btn-warning">Dettagli <i class="bi bi-arrow-right"></i></a>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/header :: bootstrapScript}"></div>
</body>

</html>
